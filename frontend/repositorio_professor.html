<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório (Professor) - Portal Educacional</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS REUTILIZADO DO DASHBOARD */
        :root { --primary-color: #2d8b8b; --primary-dark: #236e6e; --primary-light: #e0ebeb; --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333; --border-radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); }
        
        /* Layout Básico */
        header { background-color: var(--primary-color); color: white; padding: 0 30px; height: 70px; display: flex; align-items: center; justify-content: space-between; position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .container { display: flex; padding-top: 70px; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--card-bg); padding: 20px; border-right: 1px solid #eee; position: fixed; top: 70px; bottom: 0; left: 0; }
        .nav-item { display: flex; align-items: center; padding: 12px 15px; color: #666; text-decoration: none; border-radius: 10px; margin-bottom: 8px; transition: 0.3s; font-weight: 600; }
        .nav-item:hover { background-color: var(--primary-light); color: var(--primary-color); }
        .nav-item.active { background-color: var(--primary-color); color: white; }
        .nav-item i { width: 30px; text-align: center; margin-right: 5px; }
        .main-content { margin-left: 250px; padding: 30px; flex: 1; }

        /* ESTILOS ESPECÍFICOS DO REPOSITÓRIO */
        .page-header { margin-bottom: 30px; }
        
        /* Área de Upload (Só visível para professor) */
        .upload-section {
            background: white; padding: 25px; border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; border: 2px dashed #ccc;
        }
        .upload-form { display: grid; gap: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 700; color: var(--primary-dark); }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .btn-upload { background: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; width: 100%; }
        .btn-upload:hover { background: var(--primary-dark); }

        /* Lista de Arquivos */
        .file-list { display: flex; flex-direction: column; gap: 15px; }
        .file-card {
            background: white; padding: 20px; border-radius: var(--border-radius);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--primary-color);
        }
        .file-info { display: flex; align-items: center; gap: 20px; }
        .file-icon { font-size: 2.5rem; color: #e74c3c; /* Cor de PDF/Arquivo */ }
        .file-details h4 { font-size: 1.1rem; color: #333; margin-bottom: 4px; }
        .file-meta { font-size: 0.85rem; color: #777; display: flex; gap: 15px; }
        .file-comment { margin-top: 5px; font-style: italic; color: #555; background: #f9f9f9; padding: 5px 10px; border-radius: 4px; display: inline-block;}
        
        .file-actions { display: flex; gap: 10px; }
        .btn-action { padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-download { background: var(--primary-light); color: var(--primary-color); }
        .btn-delete { background: #fee2e2; color: #ef4444; } /* Botão deletar só para professor */
        .btn-download:hover { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-graduation-cap"></i> Portal Educacional</div>
        <div style="font-weight: bold;">Área do Professor</div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <a href="professor.html " class="nav-item"><i class="fas fa-home"></i> Início</a>
            
            <a href="Meus Cursos.html" class="nav-item"><i class="fas fa-laptop-code"></i> Meus Cursos</a>
            
            <a href="#" class="nav-item active"><i class="fas fa-folder"></i> Repositório</a>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>Gerenciar Arquivos</h2>
                <p>Adicione materiais complementares para os alunos.</p>
            </div>

            <div class="upload-section">
                <div class="upload-form">
                    <div class="input-group">
                        <label>Selecionar Arquivo</label>
                        <input type="file" id="fileInput" class="form-control">
                    </div>
                    <div class="input-group">
                        <label>Comentário / Descrição</label>
                        <input type="text" id="commentInput" class="form-control" placeholder="Ex: Slide da aula sobre Scrum...">
                    </div>
                    <button class="btn-upload" onclick="addFile()"><i class="fas fa-cloud-upload-alt"></i> Salvar no Repositório</button>
                </div>
            </div>

            <div class="section-header">
                <h3>Arquivos Disponíveis</h3>
            </div>

            <div class="file-list" id="repoList">
                </div>
        </main>
    </div>

    <script>
        // Função para carregar arquivos
        function loadFiles() {
            const files = JSON.parse(localStorage.getItem('repoData')) || [];
            const list = document.getElementById('repoList');
            list.innerHTML = '';

            files.forEach((file, index) => {
                list.innerHTML += `
                    <div class="file-card">
                        <div class="file-info">
                            <div class="file-icon"><i class="fas fa-file-alt"></i></div>
                            <div class="file-details">
                                <h4>${file.name}</h4>
                                <div class="file-meta">
                                    <span><i class="far fa-calendar-alt"></i> ${file.date}</span>
                                    <span><i class="fas fa-user"></i> Prof. Admin</span>
                                </div>
                                <div class="file-comment">"${file.comment}"</div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="btn-action btn-download"><i class="fas fa-download"></i> Baixar</button>
                            <button class="btn-action btn-delete" onclick="deleteFile(${index})"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                `;
            });
        }

        // Função para adicionar arquivo
        function addFile() {
            const fileInput = document.getElementById('fileInput');
            const commentInput = document.getElementById('commentInput');
            
            if(fileInput.files.length === 0) { alert("Selecione um arquivo!"); return; }
            if(commentInput.value === "") { alert("Digite um comentário!"); return; }

            const newFile = {
                name: fileInput.files[0].name,
                comment: commentInput.value,
                date: new Date().toLocaleDateString('pt-BR') // Data automática de hoje
            };

            const files = JSON.parse(localStorage.getItem('repoData')) || [];
            files.push(newFile);
            localStorage.setItem('repoData', JSON.stringify(files));
            
            // Limpar campos e recarregar
            fileInput.value = "";
            commentInput.value = "";
            loadFiles();
            alert("Arquivo salvo com sucesso!");
        }

        // Função para deletar
        function deleteFile(index) {
            if(confirm("Tem certeza que deseja apagar este arquivo?")) {
                const files = JSON.parse(localStorage.getItem('repoData')) || [];
                files.splice(index, 1);
                localStorage.setItem('repoData', JSON.stringify(files));
                loadFiles();
            }
        }

        // Carregar ao abrir a página
        window.onload = loadFiles;
    </script>
</body>
</html>
